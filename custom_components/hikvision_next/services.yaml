update_snapshot:
  name: Update snapshot
  description: Update the snapshot file in an image entity. Used by take_pictures_on_motion_detection blueprint.
  target:
    entity:
      domain: image
      integration: hikvision_next
  fields:
    filename:
      required: true
      name: Filename
      description: The filename of the snapshot to display.
      example: "/media/hikvision_next/snapshots/2024-08/07/2024-08-07__11-54-19__camera01.jpg"
      selector:
        text:

reboot:
  name: Reboot
  description: Reboot the device.
  fields:
    config_entry_id:
      required: true
      name: "Device"
      description: "Permission needed  - Remote: Shutdown/Reboot"
      selector:
        config_entry:
          integration: hikvision_next

ptz_move:
  name: PTZ move
  description: Start continuous PTZ movement on a channel. Pair with ptz_stop on release.
  fields:
    config_entry_id:
      required: true
      name: Device
      selector:
        config_entry:
          integration: hikvision_next
    channel_id:
      required: true
      name: Channel
      selector:
        number:
          min: 1
          max: 256
          mode: box
    pan:
      required: false
      default: 0
      name: Pan speed
      selector:
        number:
          min: -100
          max: 100
          mode: box
    tilt:
      required: false
      default: 0
      name: Tilt speed
      selector:
        number:
          min: -100
          max: 100
          mode: box
    zoom:
      required: false
      default: 0
      name: Zoom speed
      selector:
        number:
          min: -100
          max: 100
          mode: box

ptz_stop:
  name: PTZ stop
  description: Stop PTZ movement on a channel.
  fields:
    config_entry_id:
      required: true
      name: Device
      selector:
        config_entry:
          integration: hikvision_next
    channel_id:
      required: true
      name: Channel
      selector:
        number:
          min: 1
          max: 256
          mode: box

intercom_answer:
  name: Intercom answer
  description: Answer an incoming video intercom call via SDK RemoteConfig.
  fields:
    config_entry_id:
      required: true
      name: Device
      selector:
        config_entry:
          integration: hikvision_next

intercom_call:
  name: Intercom call
  description: Initiate an outgoing video intercom call to the client via SDK RemoteConfig.
  fields:
    config_entry_id:
      required: true
      name: Device
      selector:
        config_entry:
          integration: hikvision_next

intercom_reject:
  name: Intercom reject
  description: Reject an incoming video intercom call via SDK RemoteConfig.
  fields:
    config_entry_id:
      required: true
      name: Device
      selector:
        config_entry:
          integration: hikvision_next

intercom_hangup:
  name: Intercom hangup
  description: End the active video intercom call via SDK RemoteConfig.
  fields:
    config_entry_id:
      required: true
      name: Device
      selector:
        config_entry:
          integration: hikvision_next

isapi_request:
  name: ISAPI request
  description: "Send a custom ISAPI request to the device."
  fields:
    config_entry_id:
      required: true
      name: "Device"
      description: "The Hikvision device."
      selector:
        config_entry:
          integration: hikvision_next
    method:
      required: true
      name: "HTTP method"
      description: "WARNING: You do POST and PUT at your own risk!"
      default: GET
      selector:
        select:
          mode: dropdown
          options:
            - GET
            - POST
            - PUT
    path:
      required: true
      name: "ISAPI path"
      description: "The ISAPI endpoint to request. Example: /System/deviceInfo"
      selector:
        text:
    payload:
      required: false
      name: "Request payload"
      description: "XML data"
      selector:
        text:
          multiline: true
